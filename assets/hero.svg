<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d">
  <title id="t">Manuel Espinoza · Ingeniero de software senior</title>
  <desc id="d">Backends que sostienen la operación y agentes que entienden el código. Temuco, Chile.</desc>
  <defs>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9b9b9b"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#242424"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) both }
    .d1 { animation-delay: .08s } .d2 { animation-delay: .18s } .d3 { animation-delay: .3s } .d4 { animation-delay: .45s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } }
    .blink { animation: blink 2.4s ease-in-out infinite }
    @keyframes blink { 50% { opacity: .25 } }
    @media (prefers-reduced-motion: reduce) { .rise, .blink { animation: none } .mv { display: none } }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="320" fill="#000"/>
    <rect width="880" height="320" fill="url(#grid)"/>
    <rect width="880" height="320" fill="url(#fade)"/>
  </g>
  <rect x=".5" y=".5" width="879" height="319" rx="20" fill="none" stroke="#272727"/>

  <g class="rise d1">
    <rect x="48" y="80" width="8" height="8" rx="2" fill="#f2b544" class="blink"/>
    <text x="66" y="89" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="1.4" fill="#9b9b9b">INGENIERO DE SOFTWARE SENIOR · TEMUCO, CHILE</text>
  </g>
  <text class="rise d2" x="46" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Manuel Espinoza</text>
  <g class="rise d3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#9b9b9b">
    <text x="48" y="202">Backends que sostienen la operación</text>
    <text x="48" y="228">y agentes que entienden el código.</text>
  </g>
  <text class="rise d4" x="48" y="276" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#f2b544">alguien.dev</text>

  <g class="rise d4">
    <g fill="none" stroke="#313131" stroke-width="1.5">
      <path d="M 614 160 L 640 160"/>
      <path d="M 720 160 C 744 160, 740 84, 764 84"/>
      <path d="M 720 160 L 764 160"/>
      <path d="M 720 160 C 744 160, 740 236, 764 236"/>
    </g>
    
    <g>
      <rect x="530" y="142" width="84" height="36" rx="8" fill="#181818" stroke="#313131"/>
      <text x="572" y="165" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f4f4f2">evento</text>
    </g>
    
    <g>
      <rect x="640" y="142" width="80" height="36" rx="8" fill="#181818" stroke="#f2b544"/>
      <text x="680" y="165" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f2b544">kafka</text>
    </g>
    
    <g>
      <rect x="764" y="66" width="88" height="36" rx="8" fill="#181818" stroke="#313131"/>
      <text x="808" y="89" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f4f4f2">servicio</text>
    </g>
    
    <g>
      <rect x="764" y="142" width="88" height="36" rx="8" fill="#181818" stroke="#313131"/>
      <text x="808" y="165" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f4f4f2">agente</text>
    </g>
    
    <g>
      <rect x="764" y="218" width="88" height="36" rx="8" fill="#181818" stroke="#313131"/>
      <text x="808" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f4f4f2">erp</text>
    </g>
    
    <circle r="3.5" fill="#f2b544" class="mv" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.7s" begin="0s" repeatCount="indefinite"/>
      <animateMotion dur="2.7s" begin="0s" repeatCount="indefinite" path="M 614 160 L 640 160 L 720 160 C 744 160, 740 84, 764 84"/>
    </circle>
    
    <circle r="3.5" fill="#f2b544" class="mv" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>
      <animateMotion dur="2.7s" begin="0.9s" repeatCount="indefinite" path="M 614 160 L 640 160 L 720 160 L 764 160"/>
    </circle>
    
    <circle r="3.5" fill="#f2b544" class="mv" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.7s" begin="1.8s" repeatCount="indefinite"/>
      <animateMotion dur="2.7s" begin="1.8s" repeatCount="indefinite" path="M 614 160 L 640 160 L 720 160 C 744 160, 740 236, 764 236"/>
    </circle>
  </g>
</svg>
